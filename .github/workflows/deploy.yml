name: Continuous Deployment to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/AgentTrust
            
            # Pull latest changes from GitHub
            git pull origin main
            
            # Restart database services if changes occurred
            docker-compose up -d --remove-orphans
            
            # Re-install dependencies & reload backend
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate
            sudo systemctl restart agenttrust-backend
            
            # Re-install dependencies, build & reload frontend
            cd ../frontend
            npm install --legacy-peer-deps
            npm run build
            sudo systemctl restart agenttrust-frontend
            
            echo "Deployment Completed Successfully!"
